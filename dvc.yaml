stages:
  collect-data:
    cmd: calkit xenv -n py --no-check -- python scripts/collect-data.py
    deps:
      - scripts/collect-data.py
      - uv.lock
      - .python-version
      - .calkit/env-locks/tex.json
    outs:
      - data/raw/data.csv
    desc: Automatically generated from the 'collect-data' stage in calkit.yaml.
      Changes made here will be overwritten.
  analyze:
    cmd: calkit xenv -n py --no-check -- python scripts/analyze.py
    deps:
      - scripts/analyze.py
      - matplotlibrc
      - uv.lock
      - .python-version
      - .calkit/env-locks/tex.json
      - data/raw/data.csv
    outs:
      - figures/x-vs-y.png
      - results/summary.json:
          cache: false
          persist: false
      - tables/fits.tex:
          cache: false
          persist: false
    desc: Automatically generated from the 'analyze' stage in calkit.yaml.
      Changes made here will be overwritten.
  build-paper:
    cmd: calkit latex build -e tex --no-check paper/main.tex
    deps:
      - paper/main.tex
      - .calkit/env-locks/tex.json
      - results/summary.json
      - figures/x-vs-y.png
      - tables/fits.tex
      - paper/calkit.sty
      - paper/references.bib
      - paper/_calkit/values.tex
    outs:
      - paper/main.pdf
    desc: Automatically generated from the 'build-paper' stage in calkit.yaml.
      Changes made here will be overwritten.
