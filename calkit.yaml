owner: calkit
name: example-basic
title: Basic Calkit example
description: A basic Calkit example project.
git_repo_url: https://github.com/calkit/example-basic

requirements:
  - uv

questions:
  - question: How does the system respond to increasing $x$?
    hypothesis: The value of $y$ increases linearly with $x$.
    answer: $y$ increases quadratically with $x$, not linearly
      ($R^2 = {r2:.3f}$ for the quadratic fit).
    evidence:
      - kind: figure
        path: figures/x-vs-y.png
      - kind: value
        path: results/summary.json
        key: r_squared_quadratic
        name: r2

environments:
  py:
    kind: uv
    path: pyproject.toml
    description: A Python project environment managed with uv.
    with: [tex]
  tex:
    kind: texlive
    release: 2025
    description: TeX Live, managed by Calkit.

pipeline:
  stages:
    collect-data:
      kind: python-script
      script_path: scripts/collect-data.py
      environment: py
      outputs:
        - data/raw/data.csv
    analyze:
      kind: python-script
      script_path: scripts/analyze.py
      environment: py
      inputs:
        - from_stage_outputs: collect-data
        - matplotlibrc
      outputs:
        - figures/x-vs-y.png
        - path: results/summary.json
          storage: git
        - path: tables/fits.tex
          storage: git
    build-paper:
      kind: latex
      target_path: paper/main.tex
      environment: tex

datasets:
  - path: data/raw/data.csv
    title: Raw data
    description: This is raw $x$ and $y$ data.
    stage: collect-data

figures:
  - path: figures/x-vs-y.png
    title: Analysis of $x$ vs $y$
    description: >-
      A plot of the measured $x$ vs $y$ data with linear and quadratic
      fits, showing the quadratic fit is much better.
    stage: analyze

references:
  - path: paper/references.bib

publications:
  - path: paper/main.pdf
    title: The paper
    description: This is the paper.
    stage: build-paper

showcase:
  - publication: paper/main.pdf
